name: Phase 5 verification

on:
  push:
    branches:
      - feat/phase5-familiar-faces-finite-discovery
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Phase 5 relationship-discovery verifier
        run: node scripts/check-phase5-relationship-discovery.mjs
      - name: Affected Vitest suites
        run: npx vitest run app/letters/discover/discover-browser.test.tsx 'app/write/[recipientId]/first-letter-composer.test.tsx' 'app/write/[recipientId]/page.test.tsx'
      - name: Lint Phase 5 code
        run: npx eslint app/familiar-faces.tsx app/home/familiar-faces-home.tsx app/home/room-invitations.tsx app/introduction-actions.ts app/letters/discover/actions.ts app/letters/discover/discover-browser.tsx app/letters/discover/page.tsx app/room/page.tsx lib/discover-browser-state.ts lib/familiar-faces.ts
