name: Room PR Quality Gates
on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/room-pr-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: TypeScript
        run: npx next typegen && npx tsc --noEmit
      - name: ESLint for touched files
        run: |
          git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD |
            grep -E '\.(ts|tsx|js|jsx)
        run: npm test
 |
            xargs -r npx eslint
      - name: Repository-wide lint audit (pre-existing debt reported)
        continue-on-error: true
        run: npm run lint
      - name: Full unit and security suite
        run: npm test
