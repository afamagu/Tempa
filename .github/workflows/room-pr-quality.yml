name: Room PR Quality Gates
on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/room-pr-quality.yml'
  push:
    branches:
      - 'feat/room-letters-foundation-2026-10-10'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: TypeScript
        run: npx next typegen && npx tsc --noEmit
      - name: ESLint on changed source files
        run: |
          git diff --name-only --diff-filter=ACMRT origin/main...HEAD |
            grep -E '[.](ts|tsx|js|jsx)$' |
            xargs -r npx eslint
      - name: Repository-wide lint audit
        continue-on-error: true
        run: npm run lint
      - name: Full unit and security suite
        run: npm test
