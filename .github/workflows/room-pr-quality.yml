name: Room PR Quality Gates
on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/room-pr-quality.yml'
  workflow_dispatch:
concurrency:
  group: tempa-board-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  room-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: TypeScript
        run: npx next typegen && npx tsc --noEmit
      - name: ESLint on changed source files
        run: |
          git diff --name-only --diff-filter=ACMRT origin/main...HEAD |
            grep -E '[.](ts|tsx|js|jsx)$' |
            xargs -r npx eslint
      - name: Repository-wide lint audit
        continue-on-error: true
        run: npm run lint
      - name: Focused Room and discovery regression suite
        run: >-
          npx vitest run
          lib/room-paths.test.ts
          lib/room-letter-selection.test.ts
          lib/room-browse.test.ts
          lib/room-directory.test.ts
          lib/directory-state.test.ts
          app/letters/discover/directory-browser.test.tsx
          app/app-shell.test.tsx
          app/home/page.test.ts
      - name: Full suite inventory (baseline-aware)
        run: |
          set +e
          npx vitest run --reporter=json --outputFile=/tmp/room-results.json >/tmp/room-results.log 2>&1
          rc=$?
          node -e "const r=require('/tmp/room-results.json');const f=r.testResults.flatMap(t=>t.assertionResults.filter(x=>x.status==='failed').map(x=>x.fullName)); console.log('ROOM_FAILURE_COUNT='+f.length); f.forEach(x=>console.log('ROOM_FAIL '+x));"
          tail -n 8 /tmp/room-results.log
          exit 0
      - name: Store current suite inventory
        uses: actions/upload-artifact@v4
        with:
          name: room-test-results
          path: /tmp/room-results.json

  baseline-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Baseline main tests (non-release evidence)
        run: |
          set +e
          npx vitest run --reporter=json --outputFile=/tmp/main-results.json >/tmp/tempa-main-test.log 2>&1
          rc=$?
          echo "BASELINE_EXIT_CODE=${rc}"
          node -e "const r=require('/tmp/main-results.json');const f=r.testResults.flatMap(t=>t.assertionResults.filter(x=>x.status==='failed').map(x=>x.fullName)); console.log('MAIN_FAILURE_COUNT='+f.length); f.forEach(x=>console.log('MAIN_FAIL '+x));"
          tail -n 8 /tmp/tempa-main-test.log
          exit 0
      - name: Store main suite inventory
        uses: actions/upload-artifact@v4
        with:
          name: main-test-results
          path: /tmp/main-results.json

  regression-gate:
    needs: [room-quality, baseline-main]
    runs-on: ubuntu-latest
    steps:
      - name: Download room tests
        uses: actions/download-artifact@v4
        with:
          name: room-test-results
          path: room
      - name: Download baseline tests
        uses: actions/download-artifact@v4
        with:
          name: main-test-results
          path: baseline
      - name: Reject only regressions introduced by this PR
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const testNames = (file) => {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'))
            if (!Array.isArray(data.testResults)) throw new Error('Missing Vitest results')
            const failing = new Set()
            for (const suite of data.testResults) {
              for (const assertion of suite.assertionResults ?? []) {
                if (assertion.status === 'failed') failing.add(assertion.fullName)
              }
            }
            return failing
          }
          const baseline = testNames('baseline/main-results.json')
          const room = testNames('room/room-results.json')
          const newFailures = [...room].filter(name => !baseline.has(name))
          console.log('Unchanged main existing failures:', baseline.size)
          console.log('Room feature failures:', room.size)
          console.log('New regression failures:', newFailures.length)
          newFailures.forEach(name => console.error('NEW REGRESSION:', name))
          if (newFailures.length) process.exitCode = 1
          NODE
